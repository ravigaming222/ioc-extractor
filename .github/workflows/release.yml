name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm test
      - name: Build artifacts
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist/pkg
          cp ioc-extractor.html README.md LICENSE dist/pkg/
          (cd dist/pkg && zip -q "../ioc-extractor-${TAG}.zip" ioc-extractor.html README.md LICENSE)
          cp ioc-extractor.html dist/
          (cd dist && sha256sum "ioc-extractor-${TAG}.zip" ioc-extractor.html > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            "dist/ioc-extractor-${TAG}.zip" dist/ioc-extractor.html dist/SHA256SUMS.txt \
            --title "$TAG" --generate-notes
